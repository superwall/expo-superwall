plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.superwallexpo'
version = '0.1.0'

android {
  namespace "expo.modules.superwallexpo"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.superwall.sdk:superwall-android:2.7.24"
  implementation 'com.android.billingclient:billing:8.0.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.2'
}
