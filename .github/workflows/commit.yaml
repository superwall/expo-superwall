name: Base CI
on:
  push:
  pull_request:
    # `labeled` so that adding the deploy-preview label publishes a preview
    # without needing a new commit.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      # Publishes a pkg.pr.new preview build. Only runs on PRs labeled
      # `deploy-preview`, and never fails CI: it needs the pkg.pr.new GitHub App
      # installed on the repo, which it currently isn't.
      - name: Publish preview package
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
        continue-on-error: true
        run: yarn dlx pkg-pr-new publish
